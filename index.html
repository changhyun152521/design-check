<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임규태 확인용 — 배너 미리보기</title>
  <meta name="description" content="배너 사진을 올리고 이창현수학 홈페이지에 적용해 미리 확인하는 화면">
  <link rel="icon" href="site/img/common/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="임규태 확인용">
  <meta property="og:description" content="배너 사진을 올리고 홈페이지에 적용해 미리 확인합니다.">
  <meta property="og:image" content="site/img/common/og-share.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css?v=13">
</head>
<body class="app">
  <section class="app-upload" id="uploadView">
    <header class="bar">
      <div class="bar-left">
        <a class="logo" href="./">임규태 확인용</a>
        <span class="bar-note">배너</span>
      </div>
      <div class="bar-actions">
        <button type="button" class="btn btn-ghost" id="btnPreviewDefault">기본 미리보기</button>
        <button type="button" class="btn btn-solid" id="btnPreview">적용</button>
      </div>
    </header>

    <main class="page">
      <figure class="shot">
        <figcaption>
          <span>상단 배너</span>
          <button type="button" data-clear>되돌리기</button>
        </figcaption>
        <label class="drop" data-ratio="2000 / 773" style="--ratio:2000 / 773" aria-label="상단 배너 올리기">
          <input id="fileTop" type="file" accept="image/*">
          <img class="preview-default" src="site/img/common/head_bg.png" alt="">
          <img class="preview" alt="">
          <em class="swap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 14.8V5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M8.2 8.8 12 5l3.8 3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5.4 16.6v1.4A1.7 1.7 0 0 0 7.1 19.7h9.8a1.7 1.7 0 0 0 1.7-1.7v-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </em>
        </label>
        <p class="file" data-filename></p>
      </figure>

      <figure class="shot">
        <figcaption>
          <span>학습 시스템</span>
          <button type="button" data-clear>되돌리기</button>
        </figcaption>
        <label class="drop" data-ratio="2000 / 1130" style="--ratio:2000 / 1130" aria-label="학습 시스템 배너 올리기">
          <input id="fileSystem" type="file" accept="image/*">
          <img class="preview-default" src="site/img/main/inc02/in02_bg.png" alt="">
          <img class="preview" alt="">
          <em class="swap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 14.8V5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M8.2 8.8 12 5l3.8 3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5.4 16.6v1.4A1.7 1.7 0 0 0 7.1 19.7h9.8a1.7 1.7 0 0 0 1.7-1.7v-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </em>
        </label>
        <p class="file" data-filename></p>
      </figure>

      <figure class="shot">
        <figcaption>
          <span>슬라이드 1</span>
          <button type="button" data-clear>되돌리기</button>
        </figcaption>
        <label class="drop" data-ratio="845 / 273" style="--ratio:845 / 273" aria-label="슬라이드 1 올리기">
          <input id="fileSlide1" type="file" accept="image/*">
          <img class="preview-default" src="site/img/main/inc01/banner01.png" alt="">
          <img class="preview" alt="">
          <em class="swap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 14.8V5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M8.2 8.8 12 5l3.8 3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5.4 16.6v1.4A1.7 1.7 0 0 0 7.1 19.7h9.8a1.7 1.7 0 0 0 1.7-1.7v-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </em>
        </label>
        <p class="file" data-filename></p>
      </figure>

      <figure class="shot">
        <figcaption>
          <span>슬라이드 2</span>
          <button type="button" data-clear>되돌리기</button>
        </figcaption>
        <label class="drop" data-ratio="845 / 273" style="--ratio:845 / 273" aria-label="슬라이드 2 올리기">
          <input id="fileSlide2" type="file" accept="image/*">
          <img class="preview-default" src="site/img/main/inc01/banner03.png" alt="">
          <img class="preview" alt="">
          <em class="swap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 14.8V5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M8.2 8.8 12 5l3.8 3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M5.4 16.6v1.4A1.7 1.7 0 0 0 7.1 19.7h9.8a1.7 1.7 0 0 0 1.7-1.7v-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </em>
        </label>
        <p class="file" data-filename></p>
      </figure>
    </main>
  </section>

  <section class="app-preview" id="previewView" hidden>
    <header class="bar">
      <div class="bar-left">
        <span class="logo">이창현수학 미리보기</span>
        <em class="bar-note" id="modeLabel">PC</em>
      </div>
      <div class="bar-actions">
        <div class="seg" role="group" aria-label="미리보기 기기">
          <button type="button" data-device="pc" class="is-on">PC</button>
          <button type="button" data-device="mobile">모바일</button>
        </div>
        <button type="button" class="btn btn-ghost" id="btnBack">배너 다시 올리기</button>
      </div>
    </header>
    <div class="preview-stage is-pc" id="previewStage">
      <div class="phone" id="phoneFrame">
        <iframe id="previewFrame" title="이창현수학 홈페이지 미리보기"></iframe>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
