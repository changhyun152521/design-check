<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임규태 확인용 — 배너 미리보기</title>
  <meta name="description" content="배너 사진을 올리고 이창현수학 홈페이지에 적용해 미리 확인하는 화면">
  <link rel="icon" href="site/img/common/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="임규태 확인용">
  <meta property="og:description" content="배너 사진을 올리고 홈페이지에 적용해 미리 확인합니다.">
  <meta property="og:image" content="site/img/common/og-share.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
  <section class="app-upload" id="uploadView">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./">임규태 확인용</a>
        <div class="btn-row">
          <button type="button" class="btn" id="btnPreviewDefault">기본 미리보기</button>
          <button type="button" class="btn btn-primary" id="btnPreview">적용 · 미리보기</button>
        </div>
      </div>
    </header>

    <main class="studio">
      <p class="lead">홈페이지에 실제로 보이는 비율입니다. 올리지 않은 칸은 기본 이미지가 유지됩니다.</p>

      <article class="slot">
        <div class="slot-head">
          <h2>상단 배너</h2>
          <span>PC 히어로 1200 × 604</span>
        </div>
        <label class="drop" style="--ratio:1200/604">
          <input id="fileTop" type="file" accept="image/*">
          <img class="preview-default" src="site/img/common/head_bg.png" alt="">
          <img class="preview" alt="">
          <div class="drop-empty"><span>사진 올리기</span></div>
        </label>
        <div class="drop-meta">
          <span data-filename>기본 이미지</span>
          <button type="button" data-clear>기본으로</button>
        </div>
      </article>

      <article class="slot">
        <div class="slot-head">
          <h2>학습 시스템 배너</h2>
          <span>PC 전체 가로 × 460</span>
        </div>
        <label class="drop" style="--ratio:1440/460">
          <input id="fileSystem" type="file" accept="image/*">
          <img class="preview-default" src="site/img/main/inc02/in02_bg.png" alt="">
          <img class="preview" alt="">
          <div class="drop-empty"><span>사진 올리기</span></div>
        </label>
        <div class="drop-meta">
          <span data-filename>기본 이미지</span>
          <button type="button" data-clear>기본으로</button>
        </div>
      </article>

      <div class="slot-pair">
        <article class="slot">
          <div class="slot-head">
            <h2>슬라이드 1</h2>
            <span>860 × 260</span>
          </div>
          <label class="drop" style="--ratio:857/260">
            <input id="fileSlide1" type="file" accept="image/*">
            <img class="preview-default" src="site/img/main/inc01/banner01.png" alt="">
            <img class="preview" alt="">
            <div class="drop-empty"><span>사진 올리기</span></div>
          </label>
          <div class="drop-meta">
            <span data-filename>기본 이미지</span>
            <button type="button" data-clear>기본으로</button>
          </div>
        </article>
        <article class="slot">
          <div class="slot-head">
            <h2>슬라이드 2</h2>
            <span>860 × 260</span>
          </div>
          <label class="drop" style="--ratio:857/260">
            <input id="fileSlide2" type="file" accept="image/*">
            <img class="preview-default" src="site/img/main/inc01/banner03.png" alt="">
            <img class="preview" alt="">
            <div class="drop-empty"><span>사진 올리기</span></div>
          </label>
          <div class="drop-meta">
            <span data-filename>기본 이미지</span>
            <button type="button" data-clear>기본으로</button>
          </div>
        </article>
      </div>
    </main>
  </section>

  <section class="app-preview" id="previewView" hidden>
    <div class="preview-toolbar">
      <div class="title">이창현수학 미리보기<em id="modeLabel">PC</em></div>
      <div class="toolbar-right">
        <div class="device-toggle" role="group" aria-label="미리보기 기기">
          <button type="button" data-device="pc" class="is-on">PC</button>
          <button type="button" data-device="mobile">모바일</button>
        </div>
        <button type="button" class="btn" id="btnBack">배너 다시 올리기</button>
      </div>
    </div>
    <div class="preview-stage is-pc" id="previewStage">
      <div class="phone" id="phoneFrame">
        <iframe id="previewFrame" title="이창현수학 홈페이지 미리보기"></iframe>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
