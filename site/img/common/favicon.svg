<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#grad)" filter="url(#shadow)"/>
  <text x="50" y="70" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#f2f2f2" text-anchor="middle" filter="url(#textShadow)" letter-spacing="-1.2" stroke="#f2f2f2" stroke-width="0.25">CH</text>
</svg>
